name: CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "macos/**"
      - "versions.sh"
      - ".github/workflows/ci.yml"
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and Package (unsigned)
    # Pinned rather than macos-latest: the app now compiles against macOS 26
    # SDK symbols (NSGlassEffectView), and `-latest` moves between OS versions
    # on GitHub's own schedule. Pinning keeps CI and release on one SDK.
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version

      - name: Cache Swift build
        uses: actions/cache@v4
        with:
          # Only the debug build used by `swift test` is cached. The release
          # slices in .build-artifacts are intentionally built from a clean
          # scratch path every time (see build-thin.sh), so caching them would
          # be a no-op.
          path: macos/.build
          key: swift-${{ runner.os }}-${{ hashFiles('macos/Package.swift', 'macos/Sources/**', 'macos/Tests/**', 'macos/tools/fetch-sparkle.sh') }}
          restore-keys: |
            swift-${{ runner.os }}-

      - name: Vendor Sparkle (pinned checksum)
        working-directory: macos
        run: tools/fetch-sparkle.sh

      - name: Test and build unsigned package
        working-directory: macos
        # package-unsigned.sh mandatorily runs the full swift test suite via
        # run_tests, so a separate `swift test` step would run everything twice.
        run: scripts/package-unsigned.sh

      - name: Upload unsigned artifacts
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-dmg
          path: |
            macos/dist/unsigned/*.dmg
            macos/dist/unsigned/manifest.txt
            macos/dist/unsigned/SHA256SUMS
          if-no-files-found: error

      # Built once against the newest SDK and handed to the capture jobs below,
      # so every OS renders the same binary a user would actually run. Packaging
      # builds a release binary into its own scratch path, so this is a separate
      # debug build rather than a reuse of that artifact.
      - name: Build screenshot executable
        working-directory: macos
        run: swift build --configuration debug --product ForgeMenuBar

      # The executable links Sparkle with an @rpath of ../Frameworks relative to
      # itself, so the framework has to travel with it: a bare binary aborts at
      # launch with "Library not loaded: @rpath/Sparkle.framework". This mirrors
      # the layout assemble-app.sh produces inside the app bundle.
      - name: Stage screenshot executable with its framework
        working-directory: macos
        run: |
          set -eu
          rm -rf screenshot-stage
          mkdir -p screenshot-stage/MacOS screenshot-stage/Frameworks
          cp .build/debug/ForgeMenuBar screenshot-stage/MacOS/
          cp -R Vendor/Sparkle/Sparkle.xcframework/macos-arm64_x86_64/Sparkle.framework \
            screenshot-stage/Frameworks/
          # Tarred because upload-artifact follows symlinks rather than
          # preserving them, which would flatten the framework's
          # Versions/Current layout and the executable bit along with it.
          tar -czf screenshot-stage.tar.gz -C screenshot-stage .

      - name: Upload screenshot executable
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-binary
          path: macos/screenshot-stage.tar.gz
          if-no-files-found: warn
          retention-days: 1

  # The panel's backdrop is chosen at runtime, so reviewing it means running it.
  # The app supports macOS 13+, and the fallback material is what the majority
  # of that range sees, so captures run across every macOS the hosted runners
  # offer rather than only the newest.
  screenshots:
    name: Screenshots (macOS ${{ matrix.os }})
    needs: test
    if: always() && needs.test.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        # Hosted arm64 images available above the app's macOS 13 floor. macOS 14
        # is deprecated by GitHub and macOS 13 is gone entirely, so the legacy
        # material cannot be exercised below 15 on hosted infrastructure; that
        # gap is covered by forcing the fallback on newer runners.
        os: ["26", "15"]
    runs-on: macos-${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download screenshot executable
        uses: actions/download-artifact@v4
        with:
          name: screenshot-binary
          path: prebuilt

      - name: Unpack screenshot executable
        run: |
          set -eu
          mkdir -p prebuilt/app
          tar -xzf prebuilt/screenshot-stage.tar.gz -C prebuilt/app
          chmod +x prebuilt/app/MacOS/ForgeMenuBar
          otool -L prebuilt/app/MacOS/ForgeMenuBar | head

      # A review aid, not a gate: a capture failure says nothing about whether
      # the app is correct, and older images may lack a usable GUI session. The
      # outcome is surfaced as a warning below rather than silently passing,
      # because a job that goes green while producing no images is worse than
      # one that fails honestly.
      - name: Capture menu panel screenshots
        id: screenshots
        continue-on-error: true
        working-directory: macos
        env:
          BINARY: ${{ github.workspace }}/prebuilt/app/MacOS/ForgeMenuBar
          OUTPUT_DIR: ${{ github.workspace }}/macos/dist/screenshots
        run: scripts/capture-screenshots.sh

      - name: Upload menu panel screenshots
        if: always() && steps.screenshots.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: menu-panel-screenshots-macos-${{ matrix.os }}
          path: macos/dist/screenshots
          if-no-files-found: error

      - name: Report capture outcome
        if: always()
        run: |
          if [ "${{ steps.screenshots.outcome }}" = "success" ]; then
            echo "::notice::Captured menu panel screenshots on macOS ${{ matrix.os }}."
          else
            echo "::warning::Screenshot capture failed on macOS ${{ matrix.os }}; no images were produced. See the capture step log."
          fi
