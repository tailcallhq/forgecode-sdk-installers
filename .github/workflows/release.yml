name: Release

# One-click release. Building/signing and notarization are DECOUPLED:
#
#   1. This workflow (manual, one click) builds + signs the app, builds + signs
#      the DMG, and submits ONLY the DMG to Apple's notary service WITHOUT
#      waiting. Nothing user-facing is created here: no GitHub release, no
#      draft, no public asset. The signed (un-stapled) DMG is stashed as a
#      private workflow artifact and a tracking issue records the submission.
#
#   2. finalize.yml (scheduled cron) polls Apple, and only once the DMG is
#      Accepted does it staple, build the Sparkle appcast, and CREATE the
#      GitHub release with the notarized DMG attached. If Apple returns Invalid,
#      that finalize run fails (red) so CI surfaces the rejection.
#
# A normal push to main triggers none of this (see draft.yml for the changelog
# draft). A release therefore only ever comes into existence with a notarized,
# stapled DMG already in hand.
on:
  # One-button release: Actions -> Release -> Run workflow. No inputs; the
  # version is read from the release-drafter draft.
  workflow_dispatch: {}
  # Dry run: PRs labeled `test-release` run the full build/sign/submit path but
  # upload only a workflow artifact and never touch a release or the queue.
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - labeled

concurrency:
  group: release-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'dispatch' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prepare:
    name: Resolve Release Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Draft releases are only visible to a token with push access, so listing
    # them requires contents: write, not read.
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag_name: ${{ steps.version.outputs.tag_name }}
      release_id: ${{ steps.version.outputs.release_id }}
    steps:
      - name: Resolve version from release-drafter draft
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # Dry runs have no drafted release; use a fixed throwaway version.
            tag="v0.0.0"
            release_id=""
          else
            # Capture the draft's immutable id alongside its tag: finalize.yml
            # publishes by id so a later release-drafter update that rewrites the
            # draft's tag/notes cannot cause an empty-notes or duplicate release.
            draft=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
              --jq 'map(select(.draft)) | sort_by(.created_at) | last | {id, tag_name} | @json' )
            [ -n "$draft" ] && [ "$draft" != "null" ] \
              || { echo "error: no draft release found; push to main first so release-drafter can draft one" >&2; exit 1; }
            tag=$(printf '%s' "$draft" | jq -r '.tag_name // empty')
            release_id=$(printf '%s' "$draft" | jq -r '.id // empty')
            [ -n "$tag" ] || { echo "error: draft release has no tag_name" >&2; exit 1; }
            [ -n "$release_id" ] || { echo "error: draft release has no id" >&2; exit 1; }
          fi
          version="${tag#v}"
          printf '%s\n' "$version" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' \
            || { echo "error: drafted tag '$tag' is not a strict semver tag" >&2; exit 1; }
          {
            echo "version=$version"
            echo "tag_name=$tag"
            echo "release_id=$release_id"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::Releasing version $version (tag $tag)"

  build_release:
    name: Build, Sign, and Submit DMG
    needs:
      - prepare
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      dmg_file: ${{ steps.version.outputs.dmg_file }}
      submission_id: ${{ steps.submit.outputs.submission_id }}
    env:
      NOTARY_PROFILE: ci-notary
      APP_VERSION: ${{ needs.prepare.outputs.version }}
      TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
    steps:
      - name: Determine signing mode
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
        run: |
          if [ -n "$MACOS_CERT_P12" ] && [ -n "$MACOS_CERT_PASSWORD" ] \
            && [ -n "$NOTARY_KEY_ID" ] && [ -n "$NOTARY_ISSUER_ID" ] \
            && [ -n "$NOTARY_KEY" ]; then
            echo "mode=signed" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            # A real, one-click release must never silently produce an unsigned,
            # un-notarizable build; that would go green with no release and no
            # queue entry, giving a false success signal.
            echo "::error::Apple signing secrets are not configured; a dispatched release cannot be signed or notarized." >&2
            exit 1
          else
            echo "mode=unsigned" >> "$GITHUB_OUTPUT"
            echo "::notice::Apple signing secrets are not configured; building an unsigned dry-run DMG (no notarization)."
          fi

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Cache Swift build
        uses: actions/cache@v4
        with:
          path: macos/.build
          key: swift-release-${{ runner.os }}-${{ hashFiles('macos/Package.swift', 'macos/Sources/**', 'macos/Tests/**', 'macos/tools/fetch-sparkle.sh') }}
          restore-keys: |
            swift-release-${{ runner.os }}-

      - name: Vendor Sparkle (pinned checksum)
        working-directory: macos
        run: tools/fetch-sparkle.sh

      - name: Derive build variables
        id: version
        env:
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -eu
          version="$APP_VERSION"
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          # Sparkle compares CFBundleVersion, so the build number must increase
          # with every published release; the release semver satisfies that.
          echo "BUILD_NUMBER=$version" >> "$GITHUB_ENV"
          # Unsigned builds carry an explicit suffix so nobody mistakes them
          # for notarized artifacts; the manifest also records build_flavor.
          suffix=""
          [ "$MODE" = "signed" ] || suffix="-unsigned"
          echo "DMG_NAME=ForgeCode-$version$suffix" >> "$GITHUB_ENV"
          echo "dmg_file=ForgeCode-$version$suffix.dmg" >> "$GITHUB_OUTPUT"

      - name: Import signing certificate
        if: steps.mode.outputs.mode == 'signed'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -eu
          keychain="$RUNNER_TEMP/release.keychain-db"
          keychain_password=$(uuidgen)
          echo "$MACOS_CERT_P12" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"
          identity=$(security find-identity -v -p codesigning "$keychain" \
            | awk -F'"' '/Developer ID Application/ {print $2; exit}')
          [ -n "$identity" ] || { echo "error: no Developer ID Application identity found in imported certificate" >&2; exit 1; }
          echo "SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "RELEASE_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Store notarization credentials
        if: steps.mode.outputs.mode == 'signed'
        env:
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          set -eu
          key_file="$RUNNER_TEMP/notary-key.p8"
          printf '%s\n' "$NOTARY_KEY" > "$key_file"
          xcrun notarytool store-credentials "$NOTARY_PROFILE" \
            --key "$key_file" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID"
          rm -f "$key_file"

      - name: Build, sign, and submit release for notarization
        id: submit
        if: steps.mode.outputs.mode == 'signed'
        working-directory: macos
        env:
          SIGNING_TEAM_ID: ${{ secrets.SIGNING_TEAM_ID }}
          # PR dry runs build and sign the full release but must NOT enqueue a
          # real Apple submission that nothing will ever poll or staple.
          SKIP_NOTARY_SUBMIT: ${{ github.event_name == 'pull_request' && '1' || '0' }}
        run: |
          set -eu
          scripts/release.sh
          if [ "${SKIP_NOTARY_SUBMIT:-0}" != "1" ]; then
            submission_id=$(tr -d '[:space:]' < "dist/signed/$DMG_NAME.notary-submission-id")
            [ -n "$submission_id" ] || { echo "error: submission id was not recorded" >&2; exit 1; }
            echo "submission_id=$submission_id" >> "$GITHUB_OUTPUT"
          fi

      - name: Build unsigned release
        if: steps.mode.outputs.mode == 'unsigned'
        working-directory: macos
        env:
          BUILD_FLAVOR: unsigned
        run: scripts/package-unsigned.sh

      - name: Stage release artifacts
        env:
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -eu
          dist="macos/dist/$MODE"
          rm -rf release-artifacts
          mkdir -p release-artifacts
          # The signed-but-un-stapled DMG plus everything finalize.yml needs to
          # poll, staple, build the appcast, and verify: the submission id, the
          # manifest (for minimum_macos), and the checksums.
          cp "$dist/$DMG_NAME.dmg" release-artifacts/
          cp "$dist/manifest.txt" release-artifacts/
          [ -f "$dist/SHA256SUMS" ] && cp "$dist/SHA256SUMS" release-artifacts/ || true
          # The submission id exists only for a real (non-dry-run) signed build.
          if [ -f "$dist/$DMG_NAME.notary-submission-id" ]; then
            cp "$dist/$DMG_NAME.notary-submission-id" release-artifacts/
          fi

      - name: Upload staged artifacts
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: release-artifacts/*
          if-no-files-found: error
          # Long enough that a slow/stuck Apple notarization cannot strand the
          # DMG before finalize.yml downloads it. Apple normally finishes in
          # minutes; this is a wide safety margin.
          retention-days: 30

      - name: Report dry-run artifact
        if: github.event_name == 'pull_request'
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          echo "::notice::Release dry run complete ($MODE mode); artifact: $ARTIFACT_URL"
          {
            echo "## Release dry run"
            echo ""
            echo "- Signing mode: \`$MODE\`"
            echo "- DMG: \`$DMG_NAME.dmg\`"
            echo "- Artifact: $ARTIFACT_URL"
            echo ""
            echo "No release was created, and nothing was submitted to the notarization queue."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up keychain
        if: always()
        run: |
          if [ -n "${RELEASE_KEYCHAIN:-}" ] && [ -f "$RELEASE_KEYCHAIN" ]; then
            security delete-keychain "$RELEASE_KEYCHAIN"
          fi

  queue_notarization:
    name: Queue Notarization
    needs:
      - prepare
      - build_release
    # Only real releases (workflow_dispatch) with a signed submission enter the
    # queue. PR dry runs and unsigned builds never touch the queue.
    if: >-
      github.event_name == 'workflow_dispatch'
      && needs.build_release.result == 'success'
      && needs.build_release.outputs.mode == 'signed'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
      VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
      DMG_FILE: ${{ needs.build_release.outputs.dmg_file }}
      SUBMISSION_ID: ${{ needs.build_release.outputs.submission_id }}
      RUN_ID: ${{ github.run_id }}
    steps:
      - name: Ensure notarization-pending label exists
        run: |
          gh label create notarization-pending \
            --repo "$GITHUB_REPOSITORY" \
            --description "A signed DMG is awaiting Apple notarization" \
            --color FBCA04 2>/dev/null || true

      - name: Open tracking issue (pending queue marker)
        run: |
          set -euo pipefail
          # The tracking issue is the durable, queryable hand-off between this
          # build and the scheduled finalize workflow. Its JSON block is the
          # source of truth the poller reads.
          body=$(cat <<EOF
          Automated notarization tracker. Do not edit the JSON block — the
          scheduled \`finalize.yml\` workflow reads it to poll Apple, staple the
          DMG, and publish the release once notarization is accepted.

          <!-- notary-queue
          {
            "tag_name": "$TAG_NAME",
            "version": "$VERSION",
            "release_id": "$RELEASE_ID",
            "dmg_file": "$DMG_FILE",
            "submission_id": "$SUBMISSION_ID",
            "build_run_id": "$RUN_ID"
          }
          notary-queue -->

          - Tag: \`$TAG_NAME\`
          - Submission: \`$SUBMISSION_ID\`
          - Build run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$RUN_ID
          EOF
          )
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "Notarization pending: $TAG_NAME" \
            --label notarization-pending \
            --body "$body"
          echo "::notice::Queued $TAG_NAME for notarization (submission $SUBMISSION_ID). finalize.yml will publish once Apple accepts it."
