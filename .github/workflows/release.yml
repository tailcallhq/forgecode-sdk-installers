name: Release

# Builds and publishes the artifacts for a version tag.
#
# Normally reached automatically: sdk-released.yml pushes the tag with a PAT,
# which (unlike the default GITHUB_TOKEN) does raise the push event this
# listens for.
#
# The tag is the single source of truth for the version, and versions.sh must
# already agree with it — the tag is created from the commit that pinned it, so
# any disagreement means the wrong commit was tagged and the build stops.

on:
  push:
    tags: ['v*']
  # Manual re-run path. Needed because sdk-released.yml's idempotency guard
  # makes re-dispatching an already-tagged version a no-op: if the tag landed
  # but this workflow failed afterwards, or the push PAT was unavailable and
  # the tag was pushed with GITHUB_TOKEN (which does not raise push events),
  # this is the only way to drive the release. Run it with --ref <tag>; the
  # validation below still requires the ref to be a vX.Y.Z tag that agrees
  # with versions.sh, so this adds no way to publish an arbitrary ref.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: macos-14
    permissions:
      contents: write   # create the release and upload assets
    steps:
      - uses: actions/checkout@v6
        with:
          # This job builds SwiftPM dependencies and EXECUTES the forge3 binary
          # downloaded from the SDK release (macos/scripts/fetch-forge3.sh).
          # The job's token is contents:write, so persisting it in .git/config
          # would let a compromised release asset rewrite this repo's contents,
          # tags and releases. Nothing here needs git push credentials: the
          # `gh release create` step below authenticates from GH_TOKEN in its
          # own env, not from .git/config.
          persist-credentials: false

      - name: Validate tag against versions.sh
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          # [[ =~ ]] anchors against the whole string; grep would match a
          # single line of a multi-line value.
          if [[ ! "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag '$REF_NAME' must match ^v[0-9]+\.[0-9]+\.[0-9]+$"
            exit 1
          fi
          . ./versions.sh
          if [ "$REF_NAME" != "$FORGE3_VERSION" ]; then
            echo "::error::tag '$REF_NAME' disagrees with FORGE3_VERSION '$FORGE3_VERSION' in versions.sh. The wrong commit was tagged; refusing to build a mislabelled release."
            exit 1
          fi
          # One version, the SDK's: APP_VERSION derives from FORGE3_VERSION, so
          # there is nothing to override here.
          echo "app_version=${FORGE3_VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: macos/.build
          key: swiftpm-${{ runner.os }}-${{ hashFiles('macos/Package.resolved') }}
          restore-keys: swiftpm-${{ runner.os }}-

      - name: Detect signing configuration
        id: signing
        env:
          SIGNING_IDENTITY: ${{ secrets.SIGNING_IDENTITY }}
          NOTARY_PROFILE: ${{ secrets.NOTARY_PROFILE }}
          SIGNING_CERTIFICATE_P12: ${{ secrets.SIGNING_CERTIFICATE_P12 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          # All-or-nothing. Checking only a subset would let a half-configured
          # repo take the signed path and then die inside `security import` or
          # `notarytool store-credentials` with an opaque error, instead of
          # either signing properly or falling back to the unsigned path.
          required=(
            SIGNING_IDENTITY NOTARY_PROFILE SIGNING_CERTIFICATE_P12
            SIGNING_CERTIFICATE_PASSWORD KEYCHAIN_PASSWORD
            NOTARY_APPLE_ID NOTARY_TEAM_ID NOTARY_PASSWORD
          )
          present=() missing=()
          for name in "${required[@]}"; do
            if [ -n "${!name:-}" ]; then present+=("$name"); else missing+=("$name"); fi
          done
          if [ ${#missing[@]} -eq 0 ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif [ ${#present[@]} -eq 0 ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No signing secrets configured; building the unsigned release."
          else
            # Partially configured is always a mistake, and silently shipping an
            # unsigned DMG from a repo that meant to sign is worse than failing.
            printf '::error::signing is partially configured; missing secret: %s\n' "${missing[@]}"
            echo "::error::Set all of ${required[*]}, or none of them to build unsigned."
            exit 1
          fi

      # --- Signed path -------------------------------------------------------
      # Inert until the Developer ID certificate and notarization credentials
      # exist. Cert issuance has a long lead time, so the unsigned path below
      # keeps releases flowing in the meantime.
      - name: Import signing certificate
        if: steps.signing.outputs.enabled == 'true'
        env:
          SIGNING_CERTIFICATE_P12: ${{ secrets.SIGNING_CERTIFICATE_P12 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          certificate="$RUNNER_TEMP/certificate.p12"
          printf '%s' "$SIGNING_CERTIFICATE_P12" | base64 --decode > "$certificate"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$certificate" -k "$keychain" \
            -P "$SIGNING_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$keychain" >/dev/null
          security list-keychain -d user -s "$keychain" login.keychain-db
          rm -f "$certificate"

      - name: Store notarization credentials
        if: steps.signing.outputs.enabled == 'true'
        env:
          NOTARY_PROFILE: ${{ secrets.NOTARY_PROFILE }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          xcrun notarytool store-credentials "$NOTARY_PROFILE" \
            --apple-id "$NOTARY_APPLE_ID" \
            --team-id "$NOTARY_TEAM_ID" \
            --password "$NOTARY_PASSWORD"

      - name: Build signed release
        if: steps.signing.outputs.enabled == 'true'
        working-directory: macos
        env:
          GH_TOKEN: ${{ secrets.FORGE3_FETCH_TOKEN }}
          # CFBundleVersion. Sparkle requires this to increase monotonically
          # across every published build; the run number does that even if a
          # tag is deleted and re-released.
          BUILD_NUMBER: ${{ github.run_number }}
          SIGNING_IDENTITY: ${{ secrets.SIGNING_IDENTITY }}
          NOTARY_PROFILE: ${{ secrets.NOTARY_PROFILE }}
        run: scripts/release.sh

      # --- Unsigned path -----------------------------------------------------
      - name: Build unsigned release
        if: steps.signing.outputs.enabled != 'true'
        working-directory: macos
        env:
          GH_TOKEN: ${{ secrets.FORGE3_FETCH_TOKEN }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: scripts/package-unsigned.sh

      - name: Resolve artifact directory
        id: artifacts
        # Values reach the script through env rather than ${{ }} interpolation.
        # Both are workflow-controlled today, but keeping every step to the same
        # rule means no future edit has to re-derive which ones are safe.
        env:
          SIGNED: ${{ steps.signing.outputs.enabled }}
          APP_VERSION: ${{ steps.version.outputs.app_version }}
        run: |
          set -euo pipefail
          if [ "$SIGNED" = "true" ]; then
            echo "dir=macos/dist/signed" >> "$GITHUB_OUTPUT"
          else
            echo "dir=macos/dist/unsigned" >> "$GITHUB_OUTPUT"
            {
              echo "## :warning: This release is UNSIGNED"
              echo ""
              echo "No Developer ID certificate or notarization credentials are configured, so"
              echo "\`ForgeCode-${APP_VERSION}.dmg\` is **not signed and not notarized**."
              echo "Gatekeeper will refuse to open it normally; users must right-click → Open, or clear"
              echo "the quarantine attribute manually."
              echo ""
              echo "Configure \`SIGNING_IDENTITY\`, \`NOTARY_PROFILE\` and \`SIGNING_CERTIFICATE_P12\` to"
              echo "produce signed builds."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Verify artifacts exist
        env:
          DIR: ${{ steps.artifacts.outputs.dir }}
          APP_VERSION: ${{ steps.version.outputs.app_version }}
        run: |
          set -euo pipefail
          for artifact in "$DIR/ForgeCode-${APP_VERSION}.dmg" "$DIR/SHA256SUMS" "$DIR/manifest.txt"; do
            [ -f "$artifact" ] || { echo "::error::missing expected artifact: $artifact"; exit 1; }
          done
          cat "$DIR/manifest.txt" >> "$GITHUB_STEP_SUMMARY"

      # TODO(sparkle): once the appcast is set up, generate and publish it here.
      # Requires the EdDSA private key in a secret and the signed DMG above.
      #
      # - name: Sign update for Sparkle
      #   run: |
      #     echo "$SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/eddsa.key"
      #     .build/checkouts/Sparkle/bin/sign_update \
      #       "${{ steps.artifacts.outputs.dir }}/ForgeCode-${{ steps.version.outputs.app_version }}.dmg" \
      #       -f "$RUNNER_TEMP/eddsa.key"
      #
      # - name: Generate appcast.xml
      #   run: scripts/generate-appcast.sh
      #
      # - name: Publish appcast to install.forgecode.dev
      #   run: scripts/publish-appcast.sh

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          DIR: ${{ steps.artifacts.outputs.dir }}
          SIGNED: ${{ steps.signing.outputs.enabled }}
        run: |
          set -euo pipefail
          notes_file="$RUNNER_TEMP/notes.md"
          if [ "$SIGNED" != "true" ]; then
            {
              echo "> [!WARNING]"
              echo "> This build is **unsigned and not notarized**. macOS Gatekeeper will block it on"
              echo "> first launch: right-click the app and choose **Open** to run it anyway."
              echo ""
            } > "$notes_file"
          else
            : > "$notes_file"
          fi
          printf 'Bundles forge3 `%s`.\n' "$TAG" >> "$notes_file"

          gh release create "$TAG" \
            --title "ForgeCode ${TAG#v}" \
            --notes-file "$notes_file" \
            --generate-notes \
            --verify-tag \
            "$DIR/ForgeCode-${TAG#v}.dmg" \
            "$DIR/SHA256SUMS" \
            "$DIR/manifest.txt"
