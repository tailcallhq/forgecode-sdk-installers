name: Release

on:
  push:
    branches:
      - main
  # Dry-run mode: PRs targeting main that carry the `test-release` label run
  # the release build, but never submit to Apple or modify a GitHub release.
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - labeled
  workflow_dispatch: {}

concurrency:
  group: release-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect macOS Changes
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      macos: ${{ steps.filter.outputs.macos }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            macos:
              - "macos/**"
              - "versions.sh"
              - ".github/scripts/**"
              - ".github/workflows/release.yml"

  draft_release:
    name: Draft Release
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    outputs:
      tag_name: ${{ steps.drafter.outputs.tag_name }}
      release_id: ${{ steps.drafter.outputs.id }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Draft Release
        id: drafter
        uses: release-drafter/release-drafter@v6
        with:
          config-name: release-drafter.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build_release:
    name: Build and Sign Release DMG
    needs:
      - changes
      - draft_release
    # A real release requires all signing and notarization credentials. A PR
    # dry run may fall back to the explicitly suffixed unsigned package.
    if: >-
      !cancelled()
      && (needs.changes.result == 'success' || needs.changes.result == 'skipped')
      && (
        (github.event_name == 'pull_request'
          && contains(github.event.pull_request.labels.*.name, 'test-release'))
        || (github.event_name != 'pull_request'
          && needs.draft_release.result == 'success'
          && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.macos == 'true'))
      )
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      appcast: ${{ steps.mode.outputs.appcast }}
      dmg_file: ${{ steps.version.outputs.dmg_file }}
    steps:
      - name: Determine signing mode
        id: mode
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          SIGNING_TEAM_ID: ${{ secrets.SIGNING_TEAM_ID }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -eu
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo "mode=unsigned" >> "$GITHUB_OUTPUT"
            echo "appcast=false" >> "$GITHUB_OUTPUT"
            echo "::notice::PR release dry runs build an unsigned artifact and never submit to Apple."
          else
            if [ -z "$MACOS_CERT_P12" ] || [ -z "$MACOS_CERT_PASSWORD" ] \
              || [ -z "$SIGNING_TEAM_ID" ] || [ -z "$NOTARY_KEY_ID" ] \
              || [ -z "$NOTARY_ISSUER_ID" ] || [ -z "$NOTARY_KEY" ]; then
              echo "::error::A real release requires MACOS_CERT_P12, MACOS_CERT_PASSWORD, SIGNING_TEAM_ID, NOTARY_KEY, NOTARY_KEY_ID, and NOTARY_ISSUER_ID."
              exit 1
            fi
            echo "mode=signed" >> "$GITHUB_OUTPUT"
            if [ -n "$SPARKLE_ED_PRIVATE_KEY" ]; then
              echo "appcast=true" >> "$GITHUB_OUTPUT"
            else
              echo "appcast=false" >> "$GITHUB_OUTPUT"
              echo "::notice::SPARKLE_ED_PRIVATE_KEY is not configured; skipping appcast generation."
            fi
          fi

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Cache Swift build
        uses: actions/cache@v4
        with:
          path: macos/.build
          key: swift-release-${{ runner.os }}-${{ hashFiles('macos/Package.swift', 'macos/Sources/**', 'macos/Tests/**', 'macos/tools/fetch-sparkle.sh') }}
          restore-keys: |
            swift-release-${{ runner.os }}-

      - name: Vendor Sparkle (pinned checksum)
        working-directory: macos
        run: tools/fetch-sparkle.sh

      - name: Derive APP_VERSION from drafted tag
        id: version
        env:
          # Dry runs have no drafted release; use a fixed throwaway version.
          TAG_NAME: ${{ github.event_name == 'pull_request' && 'v0.0.0' || needs.draft_release.outputs.tag_name }}
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -eu
          version="${TAG_NAME#v}"
          printf '%s\n' "$version" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' \
            || { echo "error: drafted tag '$TAG_NAME' is not a strict semver tag" >&2; exit 1; }
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$version" >> "$GITHUB_ENV"
          suffix=""
          [ "$MODE" = "signed" ] || suffix="-unsigned"
          echo "DMG_NAME=ForgeCode-$version$suffix" >> "$GITHUB_ENV"
          echo "dmg_file=ForgeCode-$version$suffix.dmg" >> "$GITHUB_OUTPUT"

      - name: Import signing certificate
        if: steps.mode.outputs.mode == 'signed'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -eu
          keychain="$RUNNER_TEMP/release.keychain-db"
          keychain_password=$(uuidgen)
          echo "$MACOS_CERT_P12" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"
          identity=$(security find-identity -v -p codesigning "$keychain" \
            | awk -F'"' '/Developer ID Application/ {print $2; exit}')
          [ -n "$identity" ] || { echo "error: no Developer ID Application identity found in imported certificate" >&2; exit 1; }
          echo "SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "RELEASE_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Build and sign DMG
        if: steps.mode.outputs.mode == 'signed'
        working-directory: macos
        env:
          SIGNING_TEAM_ID: ${{ secrets.SIGNING_TEAM_ID }}
        run: scripts/release.sh

      - name: Build unsigned dry-run release
        if: steps.mode.outputs.mode == 'unsigned'
        working-directory: macos
        env:
          BUILD_FLAVOR: unsigned
        run: scripts/package-unsigned.sh

      - name: Package signed candidate for job transfer
        if: github.event_name != 'pull_request' && steps.mode.outputs.mode == 'signed'
        run: |
          set -euo pipefail
          .github/scripts/release-finalization.sh clean-workspace release-transfer
          mkdir -p release-transfer/payload/sparkle
          cp -R macos/dist/signed release-transfer/payload/signed
          cp macos/Vendor/Sparkle/bin/sign_update release-transfer/payload/sparkle/sign_update
          .github/scripts/release-finalization.sh create-archive \
            release-transfer/signed-release.tar.gz release-transfer/payload
          rm -rf release-transfer/payload

      - name: Upload signed candidate for notarization
        if: github.event_name != 'pull_request' && steps.mode.outputs.mode == 'signed'
        uses: actions/upload-artifact@v4
        with:
          name: signed-release-candidate
          path: release-transfer/signed-release.tar.gz
          if-no-files-found: error
          retention-days: 7
          overwrite: true

      - name: Stage dry-run artifacts
        if: github.event_name == 'pull_request'
        env:
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -eu
          dist="macos/dist/$MODE"
          rm -rf release-artifacts
          mkdir -p release-artifacts
          cp "$dist/$DMG_NAME.dmg" release-artifacts/
          if [ -f "$dist/appcast.xml" ]; then
            cp "$dist/appcast.xml" release-artifacts/
          fi

      - name: Upload dry-run artifacts
        id: dry_run_upload
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-dry-run
          path: release-artifacts/*
          if-no-files-found: error
          overwrite: true

      - name: Report dry-run artifact
        if: github.event_name == 'pull_request'
        env:
          ARTIFACT_URL: ${{ steps.dry_run_upload.outputs.artifact-url }}
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          echo "::notice::Release dry run complete ($MODE mode); artifact: $ARTIFACT_URL"
          {
            echo "## Release dry run"
            echo ""
            echo "- Signing mode: \`$MODE\`"
            echo "- DMG: \`$DMG_NAME.dmg\`"
            echo "- Artifact: $ARTIFACT_URL"
            echo ""
            echo "No Apple notarization was submitted and no GitHub release was modified."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up keychain
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/cert.p12"
          if [ -n "${RELEASE_KEYCHAIN:-}" ] && [ -f "$RELEASE_KEYCHAIN" ]; then
            security delete-keychain "$RELEASE_KEYCHAIN"
          fi

  notarize_release:
    name: Submit and Wait for Notarization
    needs:
      - build_release
    if: >-
      !cancelled()
      && github.event_name != 'pull_request'
      && needs.build_release.result == 'success'
      && needs.build_release.outputs.mode == 'signed'
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 2880
    permissions:
      contents: read
    env:
      DMG_FILE: ${{ needs.build_release.outputs.dmg_file }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Clean persistent transfer workspace
        run: .github/scripts/release-finalization.sh clean-workspace candidate release-transfer

      - name: Download signed candidate
        uses: actions/download-artifact@v4
        with:
          name: signed-release-candidate
          path: release-transfer

      - name: Extract and validate candidate
        run: |
          set -euo pipefail
          test -f release-transfer/signed-release.tar.gz
          mkdir -p candidate
          tar -xzf release-transfer/signed-release.tar.gz -C candidate
          .github/scripts/release-finalization.sh reject-appledouble candidate
          test -f "candidate/signed/$DMG_FILE"
          test -f candidate/signed/manifest.txt
          test -f candidate/signed/SHA256SUMS
          test -f candidate/sparkle/sign_update
          find candidate/signed -maxdepth 1 -type f -print | sort
          sha256sum "candidate/signed/$DMG_FILE" | tee release-transfer/pre-notarization.sha256

      - name: Materialize App Store Connect API key
        env:
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import base64
          import json
          import os
          import pathlib

          pem = os.environ["NOTARY_KEY"].strip().replace("\\n", "\n").splitlines()
          if pem[0] != "-----BEGIN PRIVATE KEY-----" or pem[-1] != "-----END PRIVATE KEY-----":
              raise SystemExit("NOTARY_KEY must contain a PKCS#8 PEM private key")
          encoded = "".join(line.strip() for line in pem[1:-1])
          der = base64.b64decode(encoded, validate=True)
          if not der:
              raise SystemExit("NOTARY_KEY contains an empty private key")
          payload = {
              "issuer_id": os.environ["NOTARY_ISSUER_ID"],
              "key_id": os.environ["NOTARY_KEY_ID"],
              "private_key": base64.b64encode(der).decode("ascii"),
          }
          pathlib.Path("app-store-connect-key.json").write_text(
              json.dumps(payload), encoding="utf-8"
          )
          PY
          chmod 0600 app-store-connect-key.json

      - name: Submit DMG and wait for Apple acceptance
        uses: ssddOnTop/apple-code-sign-action@36903ed941d6bbc9d989fc5bf768a96f25e43be9
        with:
          input_path: candidate/signed/${{ needs.build_release.outputs.dmg_file }}
          sign: false
          notarize: true
          staple: false
          max_wait_seconds: 172800
          app_store_connect_api_key_json_file: app-store-connect-key.json
          rcodesign_version: 0.29.0

      - name: Package the accepted unstapled candidate
        run: |
          set -euo pipefail
          sha256sum -c release-transfer/pre-notarization.sha256
          .github/scripts/release-finalization.sh create-archive \
            release-transfer/notarized-release.tar.gz candidate

      - name: Upload accepted unstapled candidate
        uses: actions/upload-artifact@v4
        with:
          name: notarized-release-candidate
          path: release-transfer/notarized-release.tar.gz
          if-no-files-found: error
          retention-days: 7
          overwrite: true

      - name: Remove App Store Connect credentials
        if: always()
        run: rm -f app-store-connect-key.json

  finalize_release:
    name: Staple and Validate Release DMG
    needs:
      - draft_release
      - build_release
      - notarize_release
    if: >-
      !cancelled()
      && github.event_name != 'pull_request'
      && needs.draft_release.result == 'success'
      && needs.build_release.result == 'success'
      && needs.notarize_release.result == 'success'
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      appcast: ${{ needs.build_release.outputs.appcast }}
      dmg_file: ${{ needs.build_release.outputs.dmg_file }}
    env:
      BUILD_FLAVOR: signed
      DMG_FILE: ${{ needs.build_release.outputs.dmg_file }}
      TAG_NAME: ${{ needs.draft_release.outputs.tag_name }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Clean transfer workspace
        run: .github/scripts/release-finalization.sh clean-workspace candidate release-transfer

      - name: Restore accepted candidate
        uses: actions/download-artifact@v4
        with:
          name: notarized-release-candidate
          path: release-transfer

      - name: Extract accepted candidate
        run: |
          set -euo pipefail
          mkdir -p candidate
          tar -xzf release-transfer/notarized-release.tar.gz -C candidate
          test -f "candidate/signed/$DMG_FILE"
          test -f candidate/sparkle/sign_update
          rm -rf macos/dist/signed
          mkdir -p macos/dist macos/Vendor/Sparkle/bin
          mv candidate/signed macos/dist/signed
          cp candidate/sparkle/sign_update macos/Vendor/Sparkle/bin/sign_update
          chmod 0755 macos/Vendor/Sparkle/bin/sign_update

      - name: Normalize release environment
        run: |
          set -euo pipefail
          version="${TAG_NAME#v}"
          {
            echo "APP_VERSION=$version"
            echo "BUILD_NUMBER=$version"
            echo "DMG_NAME=${DMG_FILE%.dmg}"
          } >> "$GITHUB_ENV"

      - name: Staple and explicitly validate DMG
        working-directory: macos
        env:
          SIGNING_TEAM_ID: ${{ secrets.SIGNING_TEAM_ID }}
        run: scripts/staple-dmg.sh

      - name: Generate appcast from final stapled DMG bytes
        if: needs.build_release.outputs.appcast == 'true'
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -eu
          dist="macos/dist/signed"
          dmg="$dist/$DMG_FILE"
          signature=$(echo "$SPARKLE_ED_PRIVATE_KEY" \
            | ./macos/Vendor/Sparkle/bin/sign_update --ed-key-file - -p "$dmg")
          length=$(stat -f %z "$dmg")
          minimum_macos=$(sed -n 's/^minimum_macos=//p' "$dist/manifest.txt")
          published=$(date -u '+%a, %d %b %Y %H:%M:%S +0000')
          cat > "$dist/appcast.xml" <<XML
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>ForgeCode</title>
              <item>
                <title>ForgeCode $APP_VERSION</title>
                <link>https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG_NAME</link>
                <sparkle:version>$BUILD_NUMBER</sparkle:version>
                <sparkle:shortVersionString>$APP_VERSION</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>$minimum_macos</sparkle:minimumSystemVersion>
                <pubDate>$published</pubDate>
                <enclosure url="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG_NAME/$DMG_FILE" type="application/octet-stream" length="$length" sparkle:edSignature="$signature" />
              </item>
            </channel>
          </rss>
          XML
          sed -i '' 's/^          //' "$dist/appcast.xml"
          xmllint --noout "$dist/appcast.xml"

      - name: Stage only final release artifacts
        env:
          HAS_APPCAST: ${{ needs.build_release.outputs.appcast }}
        run: |
          .github/scripts/release-finalization.sh stage-final \
            macos/dist/signed release-artifacts "$DMG_FILE" "$HAS_APPCAST"

      - name: Upload final notarized release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-final
          path: release-artifacts/*
          if-no-files-found: error
          overwrite: true

  upload_release_artifacts:
    name: Upload Release Artifacts
    needs:
      - draft_release
      - finalize_release
    if: >-
      !cancelled()
      && github.event_name != 'pull_request'
      && needs.draft_release.result == 'success'
      && needs.finalize_release.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG_NAME: ${{ needs.draft_release.outputs.tag_name }}
      DMG_FILE: ${{ needs.finalize_release.outputs.dmg_file }}
      HAS_APPCAST: ${{ needs.finalize_release.outputs.appcast }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download final staged artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-macos-final
          path: release-artifacts

      - name: Validate complete final artifact set
        run: |
          set -euo pipefail
          cd release-artifacts
          expected=("$DMG_FILE" "SHA256SUMS.transfer")
          if [ "$HAS_APPCAST" = "true" ]; then
            expected+=("appcast.xml")
          fi
          for file in "${expected[@]}"; do
            test -f "$file" || { echo "missing expected final artifact: $file" >&2; exit 1; }
          done
          ../.github/scripts/release-finalization.sh verify-transfer .
          actual_count=$(find . -maxdepth 1 -type f | wc -l | tr -d ' ')
          expected_count=${#expected[@]}
          if [ "$actual_count" != "$expected_count" ]; then
            echo "expected $expected_count final artifacts, found $actual_count" >&2
            find . -maxdepth 1 -type f -print | sort >&2
            exit 1
          fi

      - name: Upload final artifacts to draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          release=$(gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft)
          [ "$(jq -r '.isDraft' <<< "$release")" = "true" ] \
            || { echo "target release is not a draft: $TAG_NAME" >&2; exit 1; }

          assets=("release-artifacts/$DMG_FILE")
          if [ "$HAS_APPCAST" = "true" ]; then
            assets+=("release-artifacts/appcast.xml")
          fi
          gh release upload "$TAG_NAME" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber

          release=$(gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --json assets)
          for asset in "${assets[@]}"; do
            name=${asset##*/}
            jq -e --arg name "$name" '.assets | any(.name == $name)' <<< "$release" >/dev/null \
              || { echo "uploaded asset is missing from draft release: $name" >&2; exit 1; }
          done

          jq -r '.assets[].name' <<< "$release" \
            | .github/scripts/release-finalization.sh obsolete-assets "$DMG_FILE" "$HAS_APPCAST" \
            | while IFS= read -r asset; do
                gh release delete-asset "$TAG_NAME" "$asset" --repo "$GITHUB_REPOSITORY" --yes
              done
