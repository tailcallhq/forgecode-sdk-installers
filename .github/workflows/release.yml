name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    name: Detect macOS Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      macos: ${{ steps.filter.outputs.macos }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            macos:
              - "macos/**"
              - "versions.sh"
              - ".github/workflows/release.yml"

  draft_release:
    name: Draft Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      tag_name: ${{ steps.drafter.outputs.tag_name }}
      release_id: ${{ steps.drafter.outputs.id }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Draft Release
        id: drafter
        uses: release-drafter/release-drafter@v6
        with:
          config-name: release-drafter.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build_release:
    name: Build Signed DMG
    needs:
      - changes
      - draft_release
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.macos == 'true'
    runs-on: macos-latest
    permissions:
      contents: read
    outputs:
      built: ${{ steps.check.outputs.ready }}
    env:
      NOTARY_PROFILE: ci-notary
    steps:
      - name: Check signing secrets
        id: check
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
        run: |
          if [ -n "$MACOS_CERT_P12" ] && [ -n "$MACOS_CERT_PASSWORD" ] \
            && [ -n "$NOTARY_KEY_ID" ] && [ -n "$NOTARY_ISSUER_ID" ] \
            && [ -n "$NOTARY_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Signing secrets are not configured; skipping signed release build."
          fi

      - name: Checkout Code
        if: steps.check.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Cache Swift build
        if: steps.check.outputs.ready == 'true'
        uses: actions/cache@v4
        with:
          path: macos/.build
          key: swift-release-${{ runner.os }}-${{ hashFiles('macos/Package.swift', 'macos/Sources/**', 'macos/Tests/**') }}
          restore-keys: |
            swift-release-${{ runner.os }}-

      - name: Derive APP_VERSION from drafted tag
        if: steps.check.outputs.ready == 'true'
        env:
          TAG_NAME: ${{ needs.draft_release.outputs.tag_name }}
        run: |
          set -eu
          version="${TAG_NAME#v}"
          printf '%s\n' "$version" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' \
            || { echo "error: drafted tag '$TAG_NAME' is not a strict semver tag" >&2; exit 1; }
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"

      - name: Import signing certificate
        if: steps.check.outputs.ready == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -eu
          keychain="$RUNNER_TEMP/release.keychain-db"
          keychain_password=$(uuidgen)
          echo "$MACOS_CERT_P12" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"
          identity=$(security find-identity -v -p codesigning "$keychain" \
            | awk -F'"' '/Developer ID Application/ {print $2; exit}')
          [ -n "$identity" ] || { echo "error: no Developer ID Application identity found in imported certificate" >&2; exit 1; }
          echo "SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "RELEASE_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Store notarization credentials
        if: steps.check.outputs.ready == 'true'
        env:
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          set -eu
          key_file="$RUNNER_TEMP/notary-key.p8"
          printf '%s\n' "$NOTARY_KEY" > "$key_file"
          xcrun notarytool store-credentials "$NOTARY_PROFILE" \
            --key "$key_file" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID"
          rm -f "$key_file"

      - name: Build, sign, and notarize release
        if: steps.check.outputs.ready == 'true'
        working-directory: macos
        env:
          SIGNING_TEAM_ID: ${{ secrets.SIGNING_TEAM_ID }}
        run: scripts/release.sh

      - name: Stage release artifacts
        if: steps.check.outputs.ready == 'true'
        run: |
          set -eu
          rm -rf release-artifacts
          mkdir -p release-artifacts
          cp "macos/dist/signed/ForgeCode-$APP_VERSION.dmg" release-artifacts/
          cp macos/dist/signed/manifest.txt release-artifacts/
          cp macos/dist/signed/SHA256SUMS release-artifacts/

      - name: Upload staged artifacts
        if: steps.check.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: release-artifacts/*
          if-no-files-found: error

      - name: Clean up keychain
        if: always()
        run: |
          if [ -n "${RELEASE_KEYCHAIN:-}" ] && [ -f "$RELEASE_KEYCHAIN" ]; then
            security delete-keychain "$RELEASE_KEYCHAIN"
          fi

  upload_release_artifacts:
    name: Upload Release Artifacts
    needs:
      - draft_release
      - build_release
    if: needs.draft_release.result == 'success' && needs.build_release.result == 'success' && needs.build_release.outputs.built == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG_NAME: ${{ needs.draft_release.outputs.tag_name }}
    steps:
      - name: Download staged artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-macos
          path: release-artifacts

      - name: Validate complete artifact set
        run: |
          set -euo pipefail
          cd release-artifacts
          version="${TAG_NAME#v}"
          expected=(
            "ForgeCode-$version.dmg"
            "manifest.txt"
            "SHA256SUMS"
          )
          for file in "${expected[@]}"; do
            test -f "$file" || { echo "missing expected artifact: $file" >&2; exit 1; }
          done
          actual_count=$(find . -maxdepth 1 -type f | wc -l | tr -d ' ')
          expected_count=${#expected[@]}
          if [ "$actual_count" != "$expected_count" ]; then
            echo "expected $expected_count artifacts, found $actual_count" >&2
            find . -maxdepth 1 -type f -print | sort >&2
            exit 1
          fi

      - name: Upload artifacts to draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          find release-artifacts -maxdepth 1 -type f -print0 \
            | xargs -0 gh release upload "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --clobber
