name: Release

on:
  push:
    branches:
      - main
  # Dry-run mode: PRs targeting main that carry the `test-release` label run
  # the full release build, but upload the result as a workflow artifact
  # instead of touching any GitHub release.
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - labeled
  workflow_dispatch: {}

concurrency:
  group: release-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect macOS Changes
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      macos: ${{ steps.filter.outputs.macos }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            macos:
              - "macos/**"
              - "versions.sh"
              - ".github/workflows/release.yml"

  draft_release:
    name: Draft Release
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    outputs:
      tag_name: ${{ steps.drafter.outputs.tag_name }}
      release_id: ${{ steps.drafter.outputs.id }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Draft Release
        id: drafter
        uses: release-drafter/release-drafter@v6
        with:
          config-name: release-drafter.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build_release:
    name: Build Release DMG
    needs:
      - changes
      - draft_release
    # Runs when:
    #   - push to main touching macOS paths (or workflow_dispatch), after a
    #     successful draft; or
    #   - a PR into main labeled `test-release` (dry run, bypasses all gates).
    if: >-
      !cancelled()
      && (needs.changes.result == 'success' || needs.changes.result == 'skipped')
      && (
        (github.event_name == 'pull_request'
          && contains(github.event.pull_request.labels.*.name, 'test-release'))
        || (github.event_name != 'pull_request'
          && needs.draft_release.result == 'success'
          && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.macos == 'true'))
      )
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      appcast: ${{ steps.mode.outputs.appcast }}
      dmg_file: ${{ steps.version.outputs.dmg_file }}
    env:
      NOTARY_PROFILE: ci-notary
    steps:
      - name: Determine signing mode
        id: mode
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          if [ -n "$MACOS_CERT_P12" ] && [ -n "$MACOS_CERT_PASSWORD" ] \
            && [ -n "$NOTARY_KEY_ID" ] && [ -n "$NOTARY_ISSUER_ID" ] \
            && [ -n "$NOTARY_KEY" ]; then
            echo "mode=signed" >> "$GITHUB_OUTPUT"
          else
            echo "mode=unsigned" >> "$GITHUB_OUTPUT"
            echo "::notice::Apple signing secrets are not configured; building an unsigned release."
          fi
          if [ -n "$SPARKLE_ED_PRIVATE_KEY" ]; then
            echo "appcast=true" >> "$GITHUB_OUTPUT"
          else
            echo "appcast=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SPARKLE_ED_PRIVATE_KEY is not configured; skipping appcast generation (auto-update feed)."
          fi

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Cache Swift build
        uses: actions/cache@v4
        with:
          path: macos/.build
          key: swift-release-${{ runner.os }}-${{ hashFiles('macos/Package.swift', 'macos/Sources/**', 'macos/Tests/**', 'macos/tools/fetch-sparkle.sh') }}
          restore-keys: |
            swift-release-${{ runner.os }}-

      - name: Vendor Sparkle (pinned checksum)
        working-directory: macos
        run: tools/fetch-sparkle.sh

      - name: Derive APP_VERSION from drafted tag
        id: version
        env:
          # Dry runs have no drafted release; use a fixed throwaway version.
          TAG_NAME: ${{ github.event_name == 'pull_request' && 'v0.0.0' || needs.draft_release.outputs.tag_name }}
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -eu
          version="${TAG_NAME#v}"
          printf '%s\n' "$version" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' \
            || { echo "error: drafted tag '$TAG_NAME' is not a strict semver tag" >&2; exit 1; }
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          # Sparkle compares CFBundleVersion, so the build number must increase
          # with every published release; the release semver satisfies that.
          echo "BUILD_NUMBER=$version" >> "$GITHUB_ENV"
          # Unsigned builds carry an explicit suffix so nobody mistakes them
          # for notarized artifacts; the manifest also records build_flavor.
          suffix=""
          [ "$MODE" = "signed" ] || suffix="-unsigned"
          echo "DMG_NAME=ForgeCode-$version$suffix" >> "$GITHUB_ENV"
          echo "dmg_file=ForgeCode-$version$suffix.dmg" >> "$GITHUB_OUTPUT"

      - name: Import signing certificate
        if: steps.mode.outputs.mode == 'signed'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -eu
          keychain="$RUNNER_TEMP/release.keychain-db"
          keychain_password=$(uuidgen)
          echo "$MACOS_CERT_P12" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"
          identity=$(security find-identity -v -p codesigning "$keychain" \
            | awk -F'"' '/Developer ID Application/ {print $2; exit}')
          [ -n "$identity" ] || { echo "error: no Developer ID Application identity found in imported certificate" >&2; exit 1; }
          echo "SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "RELEASE_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Store notarization credentials
        if: steps.mode.outputs.mode == 'signed'
        env:
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          set -eu
          key_file="$RUNNER_TEMP/notary-key.p8"
          printf '%s\n' "$NOTARY_KEY" > "$key_file"
          xcrun notarytool store-credentials "$NOTARY_PROFILE" \
            --key "$key_file" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID"
          rm -f "$key_file"

      - name: Build, sign, and notarize release
        if: steps.mode.outputs.mode == 'signed'
        working-directory: macos
        env:
          SIGNING_TEAM_ID: ${{ secrets.SIGNING_TEAM_ID }}
        run: scripts/release.sh

      - name: Build unsigned release
        if: steps.mode.outputs.mode == 'unsigned'
        working-directory: macos
        env:
          BUILD_FLAVOR: unsigned
        run: scripts/package-unsigned.sh

      - name: Generate appcast
        if: steps.mode.outputs.appcast == 'true'
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          TAG_NAME: ${{ github.event_name == 'pull_request' && 'v0.0.0' || needs.draft_release.outputs.tag_name }}
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -eu
          dist="macos/dist/$MODE"
          dmg="$dist/$DMG_NAME.dmg"
          signature=$(echo "$SPARKLE_ED_PRIVATE_KEY" \
            | ./macos/Vendor/Sparkle/bin/sign_update --ed-key-file - -p "$dmg")
          length=$(stat -f %z "$dmg")
          download_url="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG_NAME/$DMG_NAME.dmg"
          minimum_macos=$(sed -n 's/^minimum_macos=//p' "$dist/manifest.txt")
          published=$(date -u '+%a, %d %b %Y %H:%M:%S +0000')
          cat > "$dist/appcast.xml" <<XML
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>ForgeCode</title>
              <item>
                <title>ForgeCode $APP_VERSION</title>
                <link>https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG_NAME</link>
                <sparkle:version>$BUILD_NUMBER</sparkle:version>
                <sparkle:shortVersionString>$APP_VERSION</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>$minimum_macos</sparkle:minimumSystemVersion>
                <pubDate>$published</pubDate>
                <enclosure url="$download_url" type="application/octet-stream" length="$length" sparkle:edSignature="$signature" />
              </item>
            </channel>
          </rss>
          XML
          # Strip the heredoc indentation so the XML declaration is at column 0.
          sed -i '' 's/^          //' "$dist/appcast.xml"
          xmllint --noout "$dist/appcast.xml"

      - name: Stage release artifacts
        env:
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -eu
          dist="macos/dist/$MODE"
          rm -rf release-artifacts
          mkdir -p release-artifacts
          # Only the DMG and the Sparkle feed are published. manifest.txt and
          # SHA256SUMS stay build-internal: they are inputs to
          # verify-release.sh, which has already run against this build, and
          # SHA256SUMS mostly hashes files *inside* the bundle, which a
          # downloader cannot check without mounting the DMG first. GitHub
          # exposes a SHA-256 digest for every release asset anyway.
          cp "$dist/$DMG_NAME.dmg" release-artifacts/
          if [ -f "$dist/appcast.xml" ]; then
            cp "$dist/appcast.xml" release-artifacts/
          fi

      - name: Upload staged artifacts
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: release-artifacts/*
          if-no-files-found: error

      - name: Report dry-run artifact
        if: github.event_name == 'pull_request'
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          echo "::notice::Release dry run complete ($MODE mode); artifact: $ARTIFACT_URL"
          {
            echo "## Release dry run"
            echo ""
            echo "- Signing mode: \`$MODE\`"
            echo "- DMG: \`$DMG_NAME.dmg\`"
            echo "- Artifact: $ARTIFACT_URL"
            echo ""
            echo "No release was created or modified."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up keychain
        if: always()
        run: |
          if [ -n "${RELEASE_KEYCHAIN:-}" ] && [ -f "$RELEASE_KEYCHAIN" ]; then
            security delete-keychain "$RELEASE_KEYCHAIN"
          fi

  upload_release_artifacts:
    name: Upload Release Artifacts
    needs:
      - draft_release
      - build_release
    if: >-
      !cancelled()
      && github.event_name != 'pull_request'
      && needs.draft_release.result == 'success'
      && needs.build_release.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG_NAME: ${{ needs.draft_release.outputs.tag_name }}
      DMG_FILE: ${{ needs.build_release.outputs.dmg_file }}
      HAS_APPCAST: ${{ needs.build_release.outputs.appcast }}
    steps:
      - name: Download staged artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-macos
          path: release-artifacts

      - name: Validate complete artifact set
        run: |
          set -euo pipefail
          cd release-artifacts
          expected=(
            "$DMG_FILE"
          )
          if [ "$HAS_APPCAST" = "true" ]; then
            expected+=("appcast.xml")
          fi
          for file in "${expected[@]}"; do
            test -f "$file" || { echo "missing expected artifact: $file" >&2; exit 1; }
          done
          actual_count=$(find . -maxdepth 1 -type f | wc -l | tr -d ' ')
          expected_count=${#expected[@]}
          if [ "$actual_count" != "$expected_count" ]; then
            echo "expected $expected_count artifacts, found $actual_count" >&2
            find . -maxdepth 1 -type f -print | sort >&2
            exit 1
          fi

      - name: Upload artifacts to draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          find release-artifacts -maxdepth 1 -type f -print0 \
            | xargs -0 gh release upload "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --clobber
